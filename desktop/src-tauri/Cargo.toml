[package]
name = "vbnotes"
version = "0.4.5"
description = "VBNotes for the desktop: markdown notes in a plain folder"
authors = ["Lavneet Sharma"]
edition = "2021"
rust-version = "1.90"
resolver = "3"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
# tray-icon: "Keep running in the tray" on Windows (Settings).
tauri = { version = "=2.12.4", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
# "Open with › VB Notes" while the app runs: Windows and Linux start a second copy, which hands
# its files to the first and quits.
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bundled SQLite comes with FTS5, which the keyword search needs.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
notify-debouncer-mini = "=0.7.0"
# Search by meaning: llama.cpp runs the phone's model (LFM2.5-Embedding-350M) on the CPU, or through
# Metal on Apple Silicon (the crate turns that on there). ureq downloads the model once; sha2 checks it.
llama-cpp-2 = { version = "=0.1.160", default-features = false }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
sha2 = "=0.10.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
