<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VBNotes Editor</title>
    <style>
      html, body { margin: 0; padding: 0; background: transparent; }
      /* Tentap turns the WebView's own scrolling off, so the editor scrolls inside this box. */
      #root > div:first-child { position: absolute; inset: 0; overflow: auto; }
      .ProseMirror { min-height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
